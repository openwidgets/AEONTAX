name: AEONCRM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aeoncrm
          POSTGRES_PASSWORD: aeoncrm
          POSTGRES_DB: aeoncrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aeoncrm -d aeoncrm_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://aeoncrm:aeoncrm@localhost:5432/aeoncrm_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @aeoncrm/db generate
      - name: Verify generated migrations are committed
        run: git diff --exit-code -- packages/db/drizzle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeoncrm-drizzle-generated
          path: packages/db/drizzle
          if-no-files-found: error
      - run: pnpm --filter @aeoncrm/db build
      - run: pnpm --filter @aeoncrm/db migrate
      - run: pnpm --filter @aeoncrm/core typecheck
      - run: pnpm --filter @aeoncrm/core test
      - run: pnpm --filter @aeontax/tax typecheck
      - run: pnpm --filter @aeontax/tax test
